<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi registro facial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="/web/estilos_meet.css">
<style>
  body { display:flex; flex-direction:column; align-items:center; padding:18px 14px 40px; }
  .caja_movil { width:100%; max-width:430px; display:flex; flex-direction:column; gap:14px; }
  .cabecera_movil { text-align:center; margin-bottom:4px; }
  .cabecera_movil i { font-size:34px; color:var(--acento); }
  .cabecera_movil h1 { font-size:20px; margin-top:8px; }
  .cabecera_movil p { font-size:13px; color:var(--texto2); margin-top:4px; }
  .tarjeta_movil { background:var(--panel); border:1px solid var(--borde); border-radius:14px; padding:16px; }
  .tarjeta_movil label { font-size:14px; }
  .tarjeta_movil input { font-size:16px; padding:13px 14px; }
  #video_movil_caja { position:relative; margin-top:12px; background:black; border-radius:12px;
    overflow:hidden; aspect-ratio:3/4; }
  #video_movil { width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
  #img_movil_sys { width:100%; height:100%; object-fit:cover; transform:scaleX(-1); display:block; }
  #canvas_movil { display:none; }
  .placeholder_cam { position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:10px; color:var(--texto2); font-size:13px;}
  .placeholder_cam i { font-size:38px; }
  .botones_movil { display:flex; flex-direction:column; gap:10px; margin-top:12px; }
  .botones_movil button { font-size:16px; padding:15px; border-radius:12px; }
  .resultado_movil { font-size:14px; min-height:20px; margin-top:8px; text-align:center; }
  .saludo { text-align:center; }
  .saludo h2 { font-size:22px; color:var(--verde); }
  .saludo p { font-size:13px; color:var(--texto2); }
  .deteccion_item { background:var(--tarjeta); border:1px solid var(--borde-sutil);
    border-left:2px solid var(--acento); border-radius:8px; padding:12px; margin-bottom:9px; }
  .deteccion_item .cuando { font-weight:700; font-size:14px; }
  .deteccion_item .donde { font-size:12.5px; color:var(--texto2); margin-top:3px; }
  .sin_datos { color:var(--texto2); font-size:13px; text-align:center; padding:16px 0; }
  .enlace_volver { text-align:center; font-size:12.5px; color:var(--texto2);
    text-decoration:none; margin-top:6px; }
  .caja_movil { position:relative; z-index:2; }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="bg-veil"></div>

<div class="caja_movil">

  <div class="cabecera_movil">
    <i class="fa-solid fa-face-smile"></i>
    <h1>Registro de rostro</h1>
    <p>Regístrate una vez y el sistema te reconocerá frente a las cámaras.</p>
  </div>

  <div id="paso_registro" class="tarjeta_movil">
    <label>Tu nombre</label>
    <input type="text" id="nombre_movil" placeholder="Nombre" autocomplete="off">

    <label class="label_selector" style="margin-top:10px;"><i class="fa-solid fa-camera-rotate"></i> ¿Qué cámara usar?</label>
    <select id="selector_cam_movil" class="selector_camara" style="font-size:15px;"></select>

    <div id="video_movil_caja">
      <video id="video_movil" autoplay playsinline muted></video>
      <img id="img_movil_sys" class="oculto" alt="Cámara del sistema">
      <canvas id="canvas_movil"></canvas>
      <div class="placeholder_cam" id="placeholder_cam">
        <i class="fa-solid fa-camera-retro"></i>
        Tu cámara aparecerá aquí
      </div>
    </div>

    <div class="botones_movil">
      <button id="btn_cam_movil" class="secundario"><i class="fa-solid fa-camera"></i> Activar cámara</button>
      <button id="btn_reg_movil" class="primario" disabled><i class="fa-solid fa-check"></i> Registrarme</button>
      <button id="btn_ver_actividad" class="secundario"><i class="fa-solid fa-magnifying-glass"></i> Ver mi actividad</button>
    </div>
    <p id="resultado_movil" class="resultado_movil"></p>
  </div>

  <div id="paso_actividad" class="oculto">
    <div class="saludo tarjeta_movil">
      <h2 id="titulo_actividad"><i class="fa-solid fa-circle-user"></i></h2>
      <p>Tus últimos registros en el sistema (se actualiza solo)</p>
      <button id="btn_otra_persona" class="secundario" style="margin-top:12px;width:100%;">
        <i class="fa-solid fa-user-plus"></i> Registrar a otra persona
      </button>
    </div>
    <div id="lista_detecciones" style="margin-top:12px;"></div>
  </div>

  <a href="/" class="enlace_volver"><i class="fa-solid fa-desktop"></i> Abrir panel completo</a>
</div>

<script src="/web/aplicacion_movil.js"></script>
<script>
(function(){
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const N = 112; // resolución de la grilla de simulación
  const off = document.createElement('canvas');
  off.width = N; off.height = N;
  const offCtx = off.getContext('2d');
  const imgData = offCtx.createImageData(N, N);

  const PRESETS = [
    { f:0.055, k:0.062 }, // coral
    { f:0.026, k:0.055 }, // gusanos
    { f:0.014, k:0.054 }, // mitosis
    { f:0.035, k:0.065 }, // manchas
    { f:0.018, k:0.051 }, // agujeros
    { f:0.030, k:0.058 }  // laberinto
  ];
  const preset = PRESETS[Math.floor(Math.random()*PRESETS.length)];
  const Du = 0.16, Dv = 0.08, dt = 1.0;

  let u = new Float32Array(N*N).fill(1);
  let v = new Float32Array(N*N).fill(0);
  let u2 = new Float32Array(N*N);
  let v2 = new Float32Array(N*N);

  function idx(x,y){ return y*N + x; }

  function seedBlob(cx, cy, r){
    for(let y=-r; y<=r; y++){
      for(let x=-r; x<=r; x++){
        const d = Math.sqrt(x*x+y*y);
        if(d <= r){
          const xi = ((cx+x)%N+N)%N;
          const yi = ((cy+y)%N+N)%N;
          const i = idx(xi,yi);
          const jitter = 0.85 + Math.random()*0.3;
          u[i] = 0.5 * jitter;
          v[i] = 0.25 * jitter;
        }
      }
    }
  }

  // sembrado inicial aleatorio (distinto en cada carga)
  const numBlobs = 5 + Math.floor(Math.random()*6);
  for(let b=0; b<numBlobs; b++){
    seedBlob(
      Math.floor(Math.random()*N),
      Math.floor(Math.random()*N),
      3 + Math.floor(Math.random()*5)
    );
  }
  // ruido de fondo leve para romper simetría
  for(let i=0;i<N*N;i++){
    if(Math.random() < 0.002){ v[i] = 0.4; u[i] = 0.4; }
  }

  function step(){
    for(let y=0; y<N; y++){
      const yN = (y-1+N)%N, yS = (y+1)%N;
      for(let x=0; x<N; x++){
        const xW = (x-1+N)%N, xE = (x+1)%N;
        const i = idx(x,y);
        const uC = u[i], vC = v[i];
        const lapU = u[idx(xW,y)] + u[idx(xE,y)] + u[idx(x,yN)] + u[idx(x,yS)] - 4*uC;
        const lapV = v[idx(xW,y)] + v[idx(xE,y)] + v[idx(x,yN)] + v[idx(x,yS)] - 4*vC;
        const reaction = uC * vC * vC;
        let nu = uC + (Du*lapU - reaction + preset.f*(1-uC)) * dt;
        let nv = vC + (Dv*lapV + reaction - (preset.f+preset.k)*vC) * dt;
        u2[i] = Math.min(1, Math.max(0, nu));
        v2[i] = Math.min(1, Math.max(0, nv));
      }
    }
    [u,u2] = [u2,u];
    [v,v2] = [v2,v];
  }

  function render(){
    const data = imgData.data;
    for(let i=0; i<N*N; i++){
      const val = Math.min(1, Math.max(0, v[i]));
      const p = i*4;
      data[p]   = 34;   // R (acento cian #22d3ee)
      data[p+1] = 211;  // G
      data[p+2] = 238;  // B
      data[p+3] = Math.round(val * 190); // alpha, sutil
    }
    offCtx.putImageData(imgData, 0, 0);

    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.imageSmoothingEnabled = true;
    ctx.globalAlpha = 0.55;
    ctx.drawImage(off, 0, 0, N, N, 0, 0, canvas.width, canvas.height);
    ctx.globalAlpha = 1;
  }

  function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  const STEPS_PER_FRAME = 8;
  function loop(){
    for(let s=0; s<STEPS_PER_FRAME; s++) step();
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
